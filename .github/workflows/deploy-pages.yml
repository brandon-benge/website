name: Deploy static website to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs (website#31). The deploy job starts only
  # after the upload has finalized, and "Re-run failed jobs" on a failed deploy
  # reuses the uploaded artifact instead of uploading a duplicate.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public website files
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Read pinned website revision
        id: website
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from scripts.build_site import read_pin
          pin = read_pin(Path.cwd())
          print(f"repository={pin['repository']}")
          print(f"ref={pin['ref']}")
          PY

      - name: Check out the pinned MakeItOurs website
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.website.outputs.repository }}
          ref: ${{ steps.website.outputs.ref }}
          path: .site-source/makeitours-website
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Verify site assembly
        run: python3 -m unittest discover -s tests -p 'test_build_site.py'

      - name: Assemble public website files
        run: python3 scripts/build_site.py --source .site-source/makeitours-website

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # The run's artifact listing is eventually consistent: deploy-pages has
      # found 0 artifacts moments after a successful upload (website#31).
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "github-pages artifact listed (attempt ${attempt})."
              exit 0
            fi
            echo "github-pages artifact not listed yet (attempt ${attempt}); waiting 10s."
            sleep 10
          done
          echo "::error::github-pages artifact was not listed for run ${GITHUB_RUN_ID} after 2 minutes."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
